<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05030f">
  <title>Nuestro Universo 💫</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Fondo: estrellas (canvas) y órbitas (canvas) -->
  <canvas id="cielo"></canvas>
  <canvas id="orbitas"></canvas>

  <!-- Aquí JavaScript crea el Sol, los planetas, la Luna y la galaxia -->
  <div id="universo"></div>

  <header id="encabezado">
    <h1>Nuestro Universo</h1>
    <p id="pista">Toca los planetas, la Luna y las estrellas fugaces ✨</p>
    <p id="contador">0/10 mensajes descubiertos</p>
  </header>

  <!-- Ventana con la frase -->
  <div id="velo"></div>
  <section id="carta" aria-live="polite">
    <div id="cartaEmoji">🌙</div>
    <h2 id="cartaTitulo">La Luna</h2>
    <p id="cartaFrase"></p>
    <button id="cartaCerrar">Seguir explorando ✨</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
